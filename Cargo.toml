[package]
name = "ensemble_methods_renoir"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.0"
renoir = { git = "https://github.com/deib-polimi/renoir", version = "0.6.1", branch = "dev" }
serde = { version = "1.0", features = ["derive", "rc"] }
rand_distr = "0.6.0"
flate2 = "1.1.9"
rand_chacha = "0.10.0"
# micrometer = { version = "0.2.7", features = ["enable", "perforation-1k"] }
mimalloc = { version = "0.1.48", default-features = false }

[profile.profiling]
inherits = "release"
debug = true
